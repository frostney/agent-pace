name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build binaries
    # macOS signs the darwin binaries it builds; cross-compiling Linux from it is supported
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the parity suite
        run: bun run check

      - name: Check the tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      - name: Build one binary per platform
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            dir="agent-pace-$version-$target"
            mkdir -p "build/$dir"
            bun run compile --target="bun-$target" --outfile "build/$dir/agent-pace"
            ln -s agent-pace "build/$dir/claude-pace"
            ln -s agent-pace "build/$dir/codex-pace"
            cp LICENSE README.md "build/$dir/"
            # no macOS extended attributes in the archive: GNU tar warns on them
            COPYFILE_DISABLE=1 tar --no-xattrs -C build -czf "release/$dir.tar.gz" "$dir"
            # the bare binary too, for installers that place one file (chezmoi's file externals)
            gzip -9 -c "build/$dir/agent-pace" > "release/$dir.gz"
          done
          (cd release && shasum -a 256 *.gz > SHA256SUMS)

      - name: Smoke-test the macOS arm64 binary
        run: |
          dir="build/agent-pace-${GITHUB_REF_NAME#v}-darwin-arm64"
          "$dir/agent-pace" --help | grep -q '{claude,codex,plan}'
          "$dir/claude-pace" --help | head -1 | grep -q '^usage: claude-pace '
          if "$dir/claude-pace" --help | grep -q '{claude,codex,plan}'; then exit 1; fi
          "$dir/codex-pace" --help | head -1 | grep -q '^usage: codex-pace '

      - name: Keep the release files for publishing
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Smoke-test Linux and publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Check the checksums and smoke-test the Linux x64 binary
        run: |
          cd release
          sha256sum -c SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          tar -xzf "agent-pace-$version-linux-x64.tar.gz"
          dir="agent-pace-$version-linux-x64"
          "$dir/agent-pace" --help | grep -q '{claude,codex,plan}'
          "$dir/claude-pace" --help | head -1 | grep -q '^usage: claude-pace '
          if "$dir/claude-pace" --help | grep -q '{claude,codex,plan}'; then exit 1; fi
          "$dir/codex-pace" --help | head -1 | grep -q '^usage: codex-pace '
          gunzip -c "$dir.gz" | cmp - "$dir/agent-pace"
          rm -r "$dir"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
